# Etheirys Proximity Voice Chat -- GitLab CI/CD
#
# Triggered by tag pushes (vX.Y.Z[.W]). At pipeline runtime the build job
# determines which release channel the tag belongs to by checking branch
# ancestry of the tagged commit:
#   * Reachable from master  -> "latest"  channel, produces latest.zip
#   * Reachable from testing -> "testing" channel, produces testing.zip
# Master is checked first, so a commit that ended up on both becomes latest.
# A tag on a commit that isn't on either branch fails the build loudly.
#
# Manual pipelines from the Pipelines page still build (useful for smoke
# tests) but the deploy job is skipped since there is no channel to publish to.
#
# Required CI/CD variables (Settings -> CI/CD -> Variables, all Masked):
#   SIGNALING_SERVER_URL    URL baked into EmbeddedConfig.cs
#   SIGNALING_SERVER_TOKEN  token baked into EmbeddedConfig.cs
#   REPO_TOKEN              bearer token for both upload endpoints
#   REPO_LATEST             full upload URL for the latest channel
#                           e.g. https://repo.etheirys.io/api/ci/plugin/etheirys-proximity-voice-chat/upload/latest
#   REPO_TESTING            full upload URL for the testing channel
#                           e.g. https://repo.etheirys.io/api/ci/plugin/etheirys-proximity-voice-chat/upload/testing
#
# Runner requirements (self-hosted):
#   - Windows, shell executor running PowerShell 5.1+ or PowerShell 7
#   - .NET 10 SDK on PATH
#   - curl.exe on PATH (ships with Windows 10+)
#   - Registered with the tag `turbotits`
#
# Dalamud assemblies are downloaded in-job from the goatcorp dalamud-distrib
# release channel, so the runner does NOT need XIVLauncher/Dalamud installed.
# Switch to stg/canary in the build job if needed.

stages:
  - build
  - deploy

variables:
  CSPROJ: EtheirysProximityVoiceChat/EtheirysProximityVoiceChat.csproj
  ARTIFACT_DIR: EtheirysProximityVoiceChat/bin/Release/EtheirysProximityVoiceChat
  # Full clone so we can run `git merge-base --is-ancestor` against master and
  # testing. Shallow clones default to depth=20 which is unreliable for tags on
  # older commits.
  GIT_DEPTH: "0"

build:
  stage: build
  tags:
    - turbotits
  rules:
    # Tagged release: v1.2.3 / v1.2.3.4 etc.
    - if: '$CI_COMMIT_TAG =~ /^v.+$/'
    # Manual run from the Pipelines page -- builds but doesn't deploy
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - |
      # Pick the version: strip the leading 'v' from the tag, or leave unset so
      # MSBuild falls back to the <Version> declared in the csproj.
      if ($env:CI_COMMIT_TAG -match '^v(.+)$') {
          $script:PluginVersion = $Matches[1]
          Write-Host "Building tagged release: $script:PluginVersion"
      } else {
          $script:PluginVersion = $null
          Write-Host "No tag -- using version embedded in csproj"
      }

    - |
      # Channel detection. Fetch master + testing if they exist on the remote,
      # then walk ancestry from the tagged commit. Master wins ties.
      git fetch --no-tags origin master:refs/remotes/origin/master 2>$null
      git fetch --no-tags origin testing:refs/remotes/origin/testing 2>$null

      git rev-parse --verify --quiet refs/remotes/origin/master *> $null
      $hasMaster = ($LASTEXITCODE -eq 0)
      git rev-parse --verify --quiet refs/remotes/origin/testing *> $null
      $hasTesting = ($LASTEXITCODE -eq 0)

      $channel = $null
      if ($hasMaster) {
          git merge-base --is-ancestor HEAD refs/remotes/origin/master *> $null
          if ($LASTEXITCODE -eq 0) { $channel = "latest" }
      }
      if (-not $channel -and $hasTesting) {
          git merge-base --is-ancestor HEAD refs/remotes/origin/testing *> $null
          if ($LASTEXITCODE -eq 0) { $channel = "testing" }
      }

      if (-not $channel) {
          if ($env:CI_PIPELINE_SOURCE -eq "web") {
              Write-Host "Manual web pipeline -- no channel, deploy will be skipped"
              $channel = "none"
          } else {
              Write-Host "##[error]Tag '$env:CI_COMMIT_TAG' is not reachable from master or testing"
              exit 1
          }
      }
      $script:Channel = $channel
      Write-Host "Channel: $script:Channel"

    - |
      # EmbeddedConfig.cs is gitignored. Stamp it in from masked CI variables.
      if (-not $env:SIGNALING_SERVER_URL -or -not $env:SIGNALING_SERVER_TOKEN) {
          Write-Host "##[error]SIGNALING_SERVER_URL and SIGNALING_SERVER_TOKEN must both be set as masked CI/CD variables"
          exit 1
      }
      $embedded = @"
      // Generated by .gitlab-ci.yml at build time.
      namespace EtheirysProximityVoiceChat;

      internal static class EmbeddedConfig
      {
          public const string SignalingServerUrl   = "$($env:SIGNALING_SERVER_URL)";
          public const string SignalingServerToken = "$($env:SIGNALING_SERVER_TOKEN)";
      }
      "@
      Set-Content -Path "EtheirysProximityVoiceChat/EmbeddedConfig.cs" -Value $embedded -Encoding UTF8

    - |
      # Dalamud.NET.Sdk needs DALAMUD_HOME or a local XIVLauncher install. The
      # runner runs as LocalSystem, so we provide Dalamud ourselves.
      $dalamudDir = Join-Path $env:CI_PROJECT_DIR ".dalamud"
      $dalamudUrl = "https://goatcorp.github.io/dalamud-distrib/latest.zip"
      if (-not (Test-Path (Join-Path $dalamudDir "Dalamud.dll"))) {
          Write-Host "Downloading Dalamud from $dalamudUrl"
          New-Item -ItemType Directory -Force -Path $dalamudDir | Out-Null
          $zipPath = Join-Path $env:CI_PROJECT_DIR ".dalamud.zip"
          Invoke-WebRequest -Uri $dalamudUrl -OutFile $zipPath -UseBasicParsing
          Expand-Archive -Path $zipPath -DestinationPath $dalamudDir -Force
          Remove-Item $zipPath
      } else {
          Write-Host "Reusing cached Dalamud at $dalamudDir"
      }
      $env:DALAMUD_HOME = $dalamudDir
      Write-Host "DALAMUD_HOME=$env:DALAMUD_HOME"

    - dotnet restore $env:CSPROJ
    - |
      if ($script:PluginVersion) {
          dotnet build $env:CSPROJ -c Release --no-restore -p:Version=$script:PluginVersion
      } else {
          dotnet build $env:CSPROJ -c Release --no-restore
      }
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - |
      # Stage the build output under dist/ with the channel-specific name and
      # pass the channel to the deploy job via a dotenv artifact.
      $dist = Join-Path $env:CI_PROJECT_DIR "dist"
      New-Item -ItemType Directory -Force -Path $dist | Out-Null
      $sourceZip = Join-Path $env:ARTIFACT_DIR "latest.zip"
      if (-not (Test-Path $sourceZip)) {
          Write-Host "##[error]Build output not found at $sourceZip"
          exit 1
      }

      $outName = switch ($script:Channel) {
          "latest"  { "latest.zip" }
          "testing" { "testing.zip" }
          default   { "latest.zip" }  # web pipeline -- keep canonical name
      }
      Copy-Item -Force $sourceZip (Join-Path $dist $outName)

      # CHANNEL is consumed by the deploy job via the dotenv report below.
      "CHANNEL=$($script:Channel)" | Out-File -FilePath build.env -Encoding ASCII
      Write-Host "Staged dist/${outName} for channel '$($script:Channel)'"
  artifacts:
    name: "EtheirysProximityVoiceChat-$CI_COMMIT_REF_SLUG"
    paths:
      - dist/
    reports:
      dotenv: build.env
    expire_in: 1 year

deploy:
  stage: deploy
  tags:
    - turbotits
  rules:
    # Tag-only -- web pipelines do not deploy.
    - if: '$CI_COMMIT_TAG =~ /^v.+$/'
  needs:
    - job: build
      artifacts: true
  script:
    # CHANNEL comes from the build job's dotenv artifact. Pick the matching URL
    # (both channels share REPO_TOKEN) and POST the zip via curl multipart form
    # upload. We invoke curl.exe explicitly because PowerShell aliases `curl`
    # to Invoke-WebRequest with incompatible flags.
    - |
      if (-not $env:REPO_TOKEN) {
          Write-Host "##[error]REPO_TOKEN must be set as a masked CI/CD variable"
          exit 1
      }

      switch ($env:CHANNEL) {
          "latest" {
              if (-not $env:REPO_LATEST) {
                  Write-Host "##[error]REPO_LATEST must be set"
                  exit 1
              }
              $zip = "dist/latest.zip"
              $url = $env:REPO_LATEST
          }
          "testing" {
              if (-not $env:REPO_TESTING) {
                  Write-Host "##[error]REPO_TESTING must be set"
                  exit 1
              }
              $zip = "dist/testing.zip"
              $url = $env:REPO_TESTING
          }
          default {
              Write-Host "##[error]CHANNEL='$env:CHANNEL' (expected 'latest' or 'testing'). Did the build job set the dotenv report?"
              exit 1
          }
      }

      if (-not (Test-Path $zip)) {
          Write-Host "##[error]Build artifact not found at $zip"
          exit 1
      }

      Write-Host "Uploading $zip to '$env:CHANNEL' channel"
      curl.exe -fsS -H "Authorization: Bearer $env:REPO_TOKEN" -F "plugin=@$zip" "$url"
      if ($LASTEXITCODE -ne 0) {
          Write-Host "##[error]curl exited with code $LASTEXITCODE"
          exit $LASTEXITCODE
      }
      Write-Host "Deploy complete."
