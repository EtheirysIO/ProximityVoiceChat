# Etheirys Proximity Voice Chat -- GitLab CI/CD
#
# Tag push (vX.Y.Z[.W]) builds the plugin with the tag's version stamped in
# and publishes a GitLab Release with latest.zip + manifest attached. Manual
# pipelines (Pipelines -> Run pipeline) build at the version embedded in
# EtheirysProximityVoiceChat.csproj -- artifacts only, no Release created.
#
# Required CI/CD variables (Settings -> CI/CD -> Variables, both Masked):
#   SIGNALING_SERVER_URL    e.g. https://signaling.example.com
#   SIGNALING_SERVER_TOKEN  the bearer token baked into EmbeddedConfig.cs
#
# Runner requirements (self-hosted):
#   - Windows, shell executor running PowerShell 5.1+ or PowerShell 7
#   - .NET 10 SDK on PATH (`dotnet --version` >= 10.0)
#   - Registered with the tag `windows`

stages:
  - build
  - release

variables:
  CSPROJ: EtheirysProximityVoiceChat/EtheirysProximityVoiceChat.csproj
  ARTIFACT_DIR: EtheirysProximityVoiceChat/bin/Release/EtheirysProximityVoiceChat

build:
  stage: build
  tags:
    - windows
  rules:
    # Tagged release: v1.2.3 / v1.2.3.4 etc.
    - if: '$CI_COMMIT_TAG =~ /^v.+$/'
    # Manual run from the Pipelines page -- no tag, falls back to csproj version
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    # Pick the version: strip the leading 'v' from the tag, or leave unset so
    # MSBuild falls back to the <Version> declared in the csproj.
    - |
      if ($env:CI_COMMIT_TAG -match '^v(.+)$') {
          $script:PluginVersion = $Matches[1]
          Write-Host "Building tagged release: $script:PluginVersion"
      } else {
          $script:PluginVersion = $null
          Write-Host "No tag -- using version embedded in csproj"
      }

    # EmbeddedConfig.cs is gitignored. Stamp it in from masked CI variables so
    # the released DLL carries the maintainer's live signaling URL + token.
    - |
      if (-not $env:SIGNALING_SERVER_URL -or -not $env:SIGNALING_SERVER_TOKEN) {
          Write-Host "##[error]SIGNALING_SERVER_URL and SIGNALING_SERVER_TOKEN must both be set as masked CI/CD variables"
          exit 1
      }
      $embedded = @"
      // Generated by .gitlab-ci.yml at build time.
      namespace EtheirysProximityVoiceChat;

      internal static class EmbeddedConfig
      {
          public const string SignalingServerUrl   = "$($env:SIGNALING_SERVER_URL)";
          public const string SignalingServerToken = "$($env:SIGNALING_SERVER_TOKEN)";
      }
      "@
      Set-Content -Path "EtheirysProximityVoiceChat/EmbeddedConfig.cs" -Value $embedded -Encoding UTF8

    - dotnet restore $env:CSPROJ
    - |
      # MSBuild global properties (-p:Version=) override the <Version> in the
      # csproj. When PluginVersion is null we omit the flag entirely so the
      # csproj value wins.
      if ($script:PluginVersion) {
          dotnet build $env:CSPROJ -c Release --no-restore -p:Version=$script:PluginVersion
      } else {
          dotnet build $env:CSPROJ -c Release --no-restore
      }
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    name: "EtheirysProximityVoiceChat-$CI_COMMIT_REF_SLUG"
    paths:
      - $ARTIFACT_DIR/latest.zip
      - $ARTIFACT_DIR/EtheirysProximityVoiceChat.json
    expire_in: 1 year

release:
  stage: release
  tags:
    - windows
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.+$/'
  needs:
    - job: build
      artifacts: true
  script:
    # Create the GitLab Release via the REST API. CI_JOB_TOKEN is auto-injected
    # and has permission to create releases on the current project. This avoids
    # requiring release-cli or any extra tooling on the Windows runner.
    #
    # Asset URLs use the latest-successful-artifact form
    # (`/-/jobs/artifacts/<ref>/raw/<path>?job=<job_name>`), so we don't need to
    # plumb the build job's CI_JOB_ID through to this job.
    - |
      $assetBase = "$env:CI_PROJECT_URL/-/jobs/artifacts/$env:CI_COMMIT_TAG/raw"
      $zipUrl    = "$assetBase/$env:ARTIFACT_DIR/latest.zip?job=build"
      $jsonUrl   = "$assetBase/$env:ARTIFACT_DIR/EtheirysProximityVoiceChat.json?job=build"

      $body = @{
          name        = "$env:CI_COMMIT_TAG"
          tag_name    = "$env:CI_COMMIT_TAG"
          description = "Automated release for ``$env:CI_COMMIT_TAG``."
          assets      = @{
              links = @(
                  @{ name = "latest.zip";                       url = $zipUrl;  link_type = "package" }
                  @{ name = "EtheirysProximityVoiceChat.json";  url = $jsonUrl; link_type = "other"   }
              )
          }
      } | ConvertTo-Json -Depth 5

      $headers = @{
          "JOB-TOKEN"    = $env:CI_JOB_TOKEN
          "Content-Type" = "application/json"
      }

      Write-Host "POST $env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/releases"
      Invoke-RestMethod `
          -Method Post `
          -Uri "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/releases" `
          -Headers $headers `
          -Body $body | Out-Null

      Write-Host "Release $env:CI_COMMIT_TAG created."
